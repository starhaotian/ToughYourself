<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
  <title>决策</title>
  <style>
    :root {
      --bg: #f3eee4;
      --paper: #faf7f1;
      --ink: #1c1814;
      --muted: #7a7268;
      --faint: #b4aba1;
      --line: #ddd4c6;
      --gray: #8a8278;
      --gold: #c4a04a;
      --work: #4e6e8e;
      --life: #a9846a;
      --red: #c45c4a;
      --green: #3f7a55;
      --serif: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
      --sans: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: #eadfd0; }
    ::placeholder { color: var(--faint); }

    button, input, textarea { font: inherit; color: inherit; }
    button { background: none; border: none; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.34; }

    .shell {
      width: min(640px, 100%);
      margin: 0 auto;
      padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .shell.wide {
      width: min(1120px, calc(100vw - 32px));
      padding-left: 16px;
      padding-right: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 24px;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: block;
    }

    .brand-name {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    header.top {
      margin-bottom: 22px;
    }

    .top-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .nav-side {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    .month-title {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-align: center;
    }

    button.quiet {
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.08em;
    }
    button.quiet:hover { color: var(--ink); }
    button.quiet.on {
      color: var(--ink);
      border-bottom: 1px solid var(--ink);
      padding-bottom: 2px;
    }
    button.arrow {
      min-width: 44px;
      min-height: 44px;
      font-size: 24px;
      line-height: 1;
    }
    button.back {
      min-width: 44px;
      min-height: 44px;
      font-size: 26px;
      line-height: 1;
      margin-left: -8px;
    }

    .weekdays, .grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      width: 100%;
    }

    .weekdays {
      margin-bottom: 6px;
    }

    .weekdays span {
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--faint);
      padding: 4px 0 10px;
    }

    .cell {
      min-height: 64px;
      padding: 6px 2px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border-radius: 8px;
    }

    .month-grid, .week-grid { gap: 5px; }

    .month-grid .cell, .week-grid .cell {
      align-items: stretch;
      padding: 8px 8px 7px;
      min-height: 72px;
      gap: 4px;
    }

    .month-grid .cell {
      cursor: pointer;
    }
    .month-grid .cell:hover { background: #ece6da; }
    .month-grid .cell.has { min-height: 128px; }
    .week-grid .cell { min-height: 88px; }
    .week-grid .cell.has { min-height: 176px; }

    .cell.has { background: var(--paper); }
    .cell.out { opacity: 0.55; }
    .cell.out .num { color: var(--faint); }
    .cell.today .num {
      font-family: var(--serif);
      font-weight: 600;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 1px;
    }

    .cell-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
    }

    .num {
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .week-grid .num {
      font-family: var(--serif);
      font-size: 22px;
    }

    .cell-n {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--faint);
      letter-spacing: 0.04em;
    }
    .cell-n.hot { color: var(--red); }
    .cell-n.due { color: var(--gold); }

    .cell-item {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
      text-align: left;
      min-width: 0;
      padding: 2px 5px 2px 8px;
    }
    .cell-item:hover .cell-t { color: var(--green); }
    .cell-item.cat-work { background: rgba(78, 110, 142, 0.10); box-shadow: inset 2.5px 0 0 var(--work); border-radius: 4px; }
    .cell-item.cat-life { background: rgba(169, 132, 106, 0.10); box-shadow: inset 2.5px 0 0 var(--life); border-radius: 4px; }

    .cell-t {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .week-grid .cell-t { font-size: 13px; }

    .cell-more {
      font-size: 11px;
      color: var(--faint);
      letter-spacing: 0.04em;
    }

    .mks {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      min-height: 10px;
    }

    .mk {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .mk svg { width: 7px; height: 7px; display: block; }

    .mk.start-live { background: var(--gray); }
    .mk.end-live, .mk.end-due, .mk.end-over {
      box-sizing: border-box;
      background: transparent;
      position: relative;
    }
    .mk.end-live { border: 1.5px solid var(--gray); }
    .mk.end-due { border: 1.7px solid var(--gold); }
    .mk.end-over { border: 1.7px solid var(--red); }
    .mk.end-live::after, .mk.end-due::after, .mk.end-over::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2.5px;
      height: 2.5px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .mk.end-live::after { background: var(--gray); }
    .mk.end-due::after { background: var(--gold); }
    .mk.end-over::after { background: var(--red); }
    .mk.start-right, .mk.end-right { background: var(--green); }
    .mk.start-wrong, .mk.end-wrong { background: var(--red); }
    .mk.start-half, .mk.end-half { background: var(--gold); }

    .week-grid .cell-item .mk { width: 10px; height: 10px; }
    .week-grid .cell-item .mk svg { width: 8px; height: 8px; display: block; }
    .week-grid .cell-item .mk.end-live::after,
    .week-grid .cell-item .mk.end-due::after,
    .week-grid .cell-item .mk.end-over::after { width: 3px; height: 3px; }

    .week-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .week-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 16px;
      align-items: start;
      padding: 16px 18px;
      border-radius: 12px;
      min-height: 88px;
      cursor: pointer;
    }
    .week-row:hover { background: #ece6da; }
    .week-row.has {
      background: var(--paper);
    }
    .week-row.today .week-date-num {
      font-family: var(--serif);
      font-weight: 600;
      border-bottom: 1px solid var(--ink);
    }
    .week-date {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-top: 2px;
    }
    .week-date-wd {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--faint);
    }
    .week-date-num {
      font-family: var(--serif);
      font-size: 28px;
      line-height: 1.1;
      width: fit-content;
    }
    .week-date-n {
      font-size: 12px;
      color: var(--faint);
      margin-top: 6px;
    }
    .week-date-n.hot { color: var(--red); }
    .week-date-n.due { color: var(--gold); }
    .week-items { min-width: 0; }
    .week-row .cell-item {
      padding: 10px 0;
      gap: 10px;
      align-items: flex-start;
      border-bottom: 1px solid var(--line);
    }
    .week-row .cell-item:last-of-type { border-bottom: none; }
    .week-row .cell-t {
      font-size: 16px;
      line-height: 1.45;
      white-space: normal;
    }
    .week-row .mk {
      width: 12px;
      height: 12px;
      margin-top: 4px;
    }
    .week-row .mk svg { width: 9px; height: 9px; display: block; }
    .week-row .mk.end-live::after,
    .week-row .mk.end-due::after,
    .week-row .mk.end-over::after { width: 3.5px; height: 3.5px; }

    .mini .grid { gap: 0; }
    .mini .cell {
      min-height: 36px;
      padding: 2px 0 4px;
      align-items: center;
      gap: 3px;
      background: transparent;
      opacity: 1;
    }
    .mini .cell.has { background: transparent; }
    .mini .num { font-size: 12px; }

    .empty-line {
      margin-top: 48px;
      text-align: center;
      color: var(--muted);
      font-family: var(--serif);
      font-size: 17px;
      letter-spacing: 0.04em;
    }

    .dock {
      margin-top: auto;
      padding-top: 32px;
      display: flex;
      justify-content: center;
    }

    .primary {
      font-family: var(--serif);
      font-size: 18px;
      letter-spacing: 0.28em;
      padding: 6px 4px 8px;
      border-bottom: 1px solid var(--ink);
    }
    .primary:hover:not(:disabled) { color: var(--green); border-bottom-color: var(--green); }

    .ghost {
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.08em;
    }
    .ghost:hover { color: var(--red); }

    .day-list { list-style: none; }
    .day-list li { border-top: 1px solid var(--line); }
    .day-list li:last-child { border-bottom: 1px solid var(--line); }

    .day-row {
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 4px 18px 12px;
    }
    .day-row.cat-work { background: rgba(78, 110, 142, 0.07); box-shadow: inset 3px 0 0 var(--work); border-radius: 4px; }
    .day-row.cat-life { background: rgba(169, 132, 106, 0.07); box-shadow: inset 3px 0 0 var(--life); border-radius: 4px; }
    .day-row:hover .theme { color: var(--green); }
    .day-row .theme {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.35;
    }

    .paper { padding-bottom: 40px; }

    .title-in {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      padding: 4px 0 12px;
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 600;
      line-height: 1.3;
      outline: none;
    }
    .title-in:focus { border-bottom-color: var(--ink); }

    .lab {
      display: block;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin: 28px 0 10px;
    }

    .cat-row { display: flex; gap: 8px; margin: 12px 0 4px; }
    .cat-pill {
      font-family: var(--serif);
      font-size: 13px;
      letter-spacing: 0.06em;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 16px 6px;
    }
    .cat-pill:hover { color: var(--ink); border-color: var(--muted); }
    .cat-pill.on { color: var(--paper); background: var(--ink); border-color: var(--ink); }
    .cat-pill.work.on { background: var(--work); border-color: var(--work); }
    .cat-pill.life.on { background: var(--life); border-color: var(--life); }

    .cat-filter { display: flex; justify-content: center; gap: 8px; margin: 0 0 16px; }
    .cat-filter .cat-pill { padding: 3px 14px 4px; font-size: 12px; }

    .line-in, .area-in {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      padding: 4px 0 10px;
      outline: none;
    }
    .area-in {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      min-height: 84px;
      resize: none;
      background: var(--paper);
    }
    .line-in:focus, .area-in:focus { border-color: var(--ink); }
    .area-in:disabled { opacity: 0.55; }

    .fold {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.06em;
      margin: 20px 0 8px;
    }
    .fold:hover { color: var(--ink); }

    .opt {
      background: var(--paper);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 12px 12px 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .opt.on { border-color: var(--ink); }

    .opt-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .radio {
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--faint);
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .opt.on .radio { border-color: var(--ink); }
    .radio i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink);
      display: none;
    }
    .opt.on .radio i { display: block; }

    .opt-num {
      display: inline-block;
      width: 16px;
      text-align: center;
      color: var(--faint);
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 400;
      flex-shrink: 0;
    }
    .opt.on .opt-num, .ro-opt.on .opt-num { color: var(--muted); }

    .opt-name {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 4px 0;
      min-width: 0;
    }

    .supp-btn {
      color: var(--faint);
      font-size: 13px;
      flex-shrink: 0;
      padding: 4px 0 4px 8px;
    }
    .supp-btn:hover, .supp-btn.on { color: var(--muted); }

    .supp { padding: 8px 0 4px 54px; }
    .supp .line-in { font-size: 13px; }
    .hint-mini { color: var(--faint); font-size: 12px; margin: 4px 0 8px 54px; }

    .add-opt {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.06em;
      margin: 4px 0 8px 2px;
    }
    .add-opt:hover { color: var(--ink); }

    .dates {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 10px;
      margin-top: 8px;
    }
    .date-pick { text-align: left; }
    .date-pick .lab { margin-top: 0; }
    .date-val {
      font-family: var(--serif);
      font-size: 18px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
      min-height: 1.4em;
    }
    .date-pick.on .date-val { border-bottom-color: var(--ink); }
    .date-val.empty { color: var(--faint); }
    .dates .dash {
      color: var(--faint);
      padding-bottom: 8px;
    }

    .mini {
      margin-top: 16px;
      padding: 12px 8px 8px;
      background: var(--paper);
      border-radius: 12px;
    }
    .mini .weekdays span { padding-bottom: 4px; font-size: 11px; }
    .mini .cell {
      min-height: 36px;
      padding: 2px 0 4px;
      gap: 3px;
    }
    .mini .cell.span { background: #ece6da88; }
    .mini .cell.pickable { cursor: pointer; }
    .mini .cell.pickable:hover { background: #ece6da; }
    .mini .num { font-size: 12px; }
    .mini .mk { width: 6px; height: 6px; }
    .mini .mk.end-live { border-width: 1px; }
    .mini .mk.end-live::after { width: 1.5px; height: 1.5px; }
    .mini .mk svg { display: none; }

    .verdicts {
      display: flex;
      gap: 8px;
      margin: 8px 0 16px;
    }
    .verdicts button {
      font-family: var(--serif);
      font-size: 20px;
      padding: 8px 16px 10px;
      color: var(--muted);
      border-bottom: 1px solid transparent;
    }
    .verdicts button:hover { color: var(--ink); }
    .verdicts button.on { color: var(--ink); border-bottom-color: var(--ink); }
    .verdicts button.on[data-v="wrong"] { color: var(--red); border-bottom-color: var(--red); }
    .verdicts button.on[data-v="right"] { color: var(--green); border-bottom-color: var(--green); }
    .verdicts button.on[data-v="half"] { color: var(--gold); border-bottom-color: var(--gold); }

    .actions {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-top: 36px;
    }

    .ro-title-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .ro-title-row .ro-title { margin-bottom: 0; }
    .cat-badge {
      flex-shrink: 0;
      font-family: var(--serif);
      font-size: 12px;
      letter-spacing: 0.08em;
      border: 1px solid;
      border-radius: 999px;
      padding: 3px 10px 4px;
    }
    .cat-badge.work { color: var(--work); border-color: var(--work); }
    .cat-badge.life { color: var(--life); border-color: var(--life); }
    .ro-title {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .ro-body { color: var(--muted); font-size: 15px; margin: 6px 0; }
    .ro-opt {
      padding: 10px 0 10px 12px;
      border-top: 1px solid var(--line);
      border-left: 2px solid transparent;
    }
    .ro-opt.on {
      color: var(--ink);
      border-left-color: var(--ink);
      background: rgba(28, 24, 20, 0.05);
      border-radius: 0 4px 4px 0;
    }
    .ro-opt strong {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ro-name { flex: 1; min-width: 0; }
    .pick-seal {
      flex-shrink: 0;
      font-family: var(--serif);
      font-size: 11px;
      line-height: 1;
      color: var(--paper);
      background: var(--ink);
      padding: 3px 6px 4px;
      border-radius: 2px;
      letter-spacing: 0.1em;
    }
    .stamp {
      font-family: var(--serif);
      font-size: 22px;
      margin: 20px 0 8px;
    }
    .stamp.right { color: var(--green); }
    .stamp.wrong { color: var(--red); }
    .stamp.half { color: var(--gold); }

    .note { padding: 10px 0; border-top: 1px solid var(--line); }
    .note-date { color: var(--faint); font-size: 11px; letter-spacing: 0.12em; }
    .note-text { color: var(--muted); font-size: 15px; margin: 6px 0 0; white-space: pre-wrap; }

    .mask {
      position: fixed;
      inset: 0;
      background: #1c181466;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .dialog {
      width: min(360px, 100%);
      background: var(--bg);
      border-radius: 12px;
      padding: 28px 24px 22px;
    }
    .dialog p {
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1.45;
      margin-bottom: 24px;
    }
    .dialog-acts { display: flex; justify-content: flex-end; gap: 20px; }

    .err { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 1.2em; }

    .tagline {
      margin: 6px 0 46px;
      color: var(--muted);
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.9;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .login {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .gbtn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 11px 26px;
      font-size: 15px;
      letter-spacing: 0.04em;
      box-shadow: 0 1px 2px rgba(28, 24, 20, 0.06);
    }
    .gbtn:hover { border-color: var(--muted); }
    .gbtn:disabled { opacity: 0.5; cursor: wait; }
    .gbtn svg { width: 18px; height: 18px; display: block; }

    .login-note {
      margin-top: 42px;
      text-align: center;
      color: var(--faint);
      font-size: 12px;
      line-height: 1.8;
    }

    .login-err { text-align: center; }

    .sync {
      text-align: center;
      color: var(--faint);
      font-size: 11px;
      letter-spacing: 0.12em;
      margin-top: 12px;
      min-height: 1.2em;
    }
    .sync.busy { color: var(--muted); }
    .sync.err { color: var(--red); }

    .set-block { margin-bottom: 40px; }
    .set-lead {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin: 4px 0 16px;
    }
    .pat-saved {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }
    .agent-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .agent-line .opt {
      flex: 1;
      margin-bottom: 0;
      text-align: left;
    }
    .agent-line .opt-top { width: 100%; }
    select.line-in {
      appearance: none;
      border-radius: 0;
      background: transparent;
    }

    @media (max-width: 720px) {
      .month-grid .cell.has { min-height: 108px; padding: 6px 5px 5px; }
      .cell-t { font-size: 11px; }
    }

    @media (max-width: 520px) {
      .shell { padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); }
      .month-title { font-size: 22px; }
      .cell { min-height: 56px; }
      .title-in, .ro-title { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="shell" id="shell"><p class="empty-line">载入中…</p></div>
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"
    integrity="sha384-ysv13JVP3fufiEXfjML9OdCa/rRbMJvUBOWyor82wfuK8INNZAvmbxHgKIHi+oqz"
    crossorigin="anonymous"
  ></script>
  <script>
    const KEY = "judgment.v2";
    const QCA_KEY = "judgment.qca.v1";
    const QCA_PAT_URL = "https://qoder.com/cloud/pat-keys";

    // ====== 部署配置：换成你自己的 Supabase 项目（步骤见 README）======
    const SUPABASE_URL = "https://lydqeymisbweiwflxhii.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_6mILqOm_8PkH2YGu28fhVA_HfX-mU6M";
    // ================================================================
    const CLOUD_READY =
      /^https:\/\/[\w-]+\.supabase\.co\/?$/.test(SUPABASE_URL) &&
      SUPABASE_PUBLISHABLE_KEY.length > 30;
    const WD = ["一", "二", "三", "四", "五", "六", "日"];
    const VERDICT = { right: "对了", wrong: "错了", half: "一半" };

    const $ = (sel, el = document) => el.querySelector(sel);

    function pad(n) { return String(n).padStart(2, "0"); }

    function iso(d) {
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function parseIso(s) {
      const [y, m, d] = s.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function today() { return iso(new Date()); }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    }

    function ym(s) {
      const d = parseIso(s);
      return { y: d.getFullYear(), m: d.getMonth() };
    }

    function addMonths(s, n) {
      const d = parseIso(s);
      d.setDate(1);
      d.setMonth(d.getMonth() + n);
      return iso(d);
    }

    function addDays(s, n) {
      const d = parseIso(s);
      d.setDate(d.getDate() + n);
      return iso(d);
    }

    function mondayOf(s) {
      const d = parseIso(s);
      const off = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - off);
      return iso(d);
    }

    function monthCells(s) {
      const { y, m } = ym(s);
      const first = new Date(y, m, 1);
      const startPad = (first.getDay() + 6) % 7;
      const cur = new Date(y, m, 1 - startPad);
      const days = [];
      for (let i = 0; i < 42; i++) {
        days.push(iso(cur));
        cur.setDate(cur.getDate() + 1);
      }
      if (days.slice(-7).every((date) => parseIso(date).getMonth() !== m)) {
        days.length = 35;
      }
      return days;
    }

    function weekCells(s) {
      const cur = parseIso(mondayOf(s));
      const days = [];
      for (let i = 0; i < 7; i++) {
        days.push(iso(cur));
        cur.setDate(cur.getDate() + 1);
      }
      return days;
    }

    function fmtShort(s) {
      if (!s) return "";
      const d = parseIso(s);
      return `${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function fmtTitle(s, mode) {
      const d = parseIso(s);
      if (mode === "week") {
        const a = parseIso(mondayOf(s));
        const b = parseIso(addDays(mondayOf(s), 6));
        if (a.getMonth() === b.getMonth()) {
          return `${a.getMonth() + 1}月${a.getDate()}日 – ${b.getDate()}日`;
        }
        return `${fmtShort(iso(a))} – ${fmtShort(iso(b))}`;
      }
      return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月`;
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function loadKey(key) {
      try {
        const raw = JSON.parse(localStorage.getItem(key) || "null");
        if (raw && Array.isArray(raw.decisions)) return raw;
      } catch (_) {}
      return { decisions: [] };
    }

    function cloudKey(id) {
      return `judgment.cloud.v2.${id}`;
    }

    function save() {
      const key = authMode === "cloud" && userId ? cloudKey(userId) : KEY;
      localStorage.setItem(key, JSON.stringify(data));
      if (authMode === "cloud") cloudSave();
    }

    // ---- 登录与云端同步（Supabase；配置见文件顶部「部署配置」）----
    let sb = null;
    let authMode = "boot"; // boot | local | cloud
    let userId = null;
    let userEmail = "";
    let loginErr = "";
    let cloudBusy = false;
    let cloudDirty = false;

    function syncText() {
      if (ui.sync === "busy") return "同步中…";
      if (ui.sync === "err") return "同步失败，已暂存本机";
      return "已同步";
    }

    function setSync(state) {
      ui.sync = state;
      const el = $("#sync");
      if (el) {
        el.className = "sync " + (state === "ok" ? "" : state);
        el.textContent = syncText();
      }
    }

    async function cloudSave() {
      const savingUserId = userId;
      if (!savingUserId) return;
      cloudDirty = true;
      if (cloudBusy) return;
      cloudBusy = true;
      setSync("busy");
      let fails = 0;
      try {
        while (cloudDirty) {
          cloudDirty = false;
          if (authMode !== "cloud" || userId !== savingUserId) {
            cloudDirty = authMode === "cloud" && !!userId;
            return;
          }
          const payload = {
            user_id: savingUserId,
            data: JSON.parse(JSON.stringify(data)),
            updated_at: new Date().toISOString(),
          };
          const { error } = await sb
            .from("decisions")
            .upsert(payload, { onConflict: "user_id" });
          if (error) {
            fails += 1;
            console.error("sync failed:", error.message);
            setSync("err");
            if (fails >= 3) return;
            await new Promise((r) => setTimeout(r, 1500 * fails));
            cloudDirty = true;
          }
        }
        setSync("ok");
      } finally {
        cloudBusy = false;
        if (cloudDirty && authMode === "cloud" && userId) cloudSave();
      }
    }

    function emptyOptions() {
      return [
        { id: uid(), name: "", note: "", pro: "", con: "", why: "" },
        { id: uid(), name: "", note: "", pro: "", con: "", why: "" },
      ];
    }

    function emptyDraft() {
      return {
        title: "",
        background: "",
        category: "work",
        options: emptyOptions(),
        chosenId: null,
        start: today(),
        end: "",
        check: "",
      };
    }

    let data = { decisions: [] };
    let ui = {
      sync: "",
      screen: "cal",
      mode: "month",
      anchor: today(),
      day: null,
      paperId: null,
      editing: false,
      pick: "end",
      bgOpen: false,
      filter: "all",
      supp: {},
      concludeOpen: false,
      verdict: "",
      miss: "",
      confirmDel: false,
      err: "",
      qcaBusy: false,
      qcaErr: "",
      qcaAgents: [],
      qcaModels: [],
      qcaReplacing: false,
      qcaConfirmDel: false,
      qcaReady: false,
    };
    let draft = emptyDraft();
    let agentForm = { id: null, name: "", system: "", model: "" };

    function byId(id) {
      return data.decisions.find((d) => d.id === id) || null;
    }

    function catOf(d) {
      return d.category === "life" ? "life" : "work";
    }

    function catPass(d) {
      return ui.filter === "all" || catOf(d) === ui.filter;
    }

    function markKind(dec, role, date) {
      if (role === "start") {
        if (dec.result) return "start-" + dec.result;
        return "start-live";
      }
      if (dec.result) return "end-" + dec.result;
      if (date < today()) return "end-over";
      if (date === today()) return "end-due";
      return "end-live";
    }

    function marksOn(date) {
      const out = [];
      for (const d of data.decisions) {
        if (d.start === date) out.push(markKind(d, "start", date));
        if (d.end === date) out.push(markKind(d, "end", date));
      }
      return out.slice(0, 6);
    }

    function glyph(kind) {
      if (kind === "end-right") {
        return `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.4 2.4 4.6-5.2" fill="none" stroke="#faf7f1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      }
      if (kind === "end-wrong") {
        return `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.2 3.2l5.6 5.6M8.8 3.2L3.2 8.8" fill="none" stroke="#faf7f1" stroke-width="1.8" stroke-linecap="round"/></svg>`;
      }
      if (kind === "end-half") {
        return `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v8" stroke="#faf7f1" stroke-width="1.8" stroke-linecap="round"/></svg>`;
      }
      return "";
    }

    function marksHtml(date) {
      const kinds = marksOn(date);
      if (!kinds.length) return `<span class="mks"></span>`;
      return `<span class="mks">${kinds.map((k) => `<span class="mk ${k}">${glyph(k)}</span>`).join("")}</span>`;
    }

    function inMonth(date, s) {
      const a = ym(date), b = ym(s);
      return a.y === b.y && a.m === b.m;
    }

    function monthHas(s) {
      return data.decisions.some((d) => (inMonth(d.start, s) || inMonth(d.end, s)) && catPass(d));
    }

    function listForDay(date) {
      return data.decisions
        .filter((d) => (d.start === date || d.end === date) && catPass(d))
        .sort((a, b) => a.createdAt - b.createdAt);
    }

    function urgency(dec, date) {
      const onEnd = dec.end === date;
      if (!dec.result && onEnd && date < today()) return 0;
      if (!dec.result && onEnd && date === today()) return 1;
      if (!dec.result && onEnd) return 2;
      if (!dec.result) return 3;
      if (dec.result === "wrong") return 4;
      if (dec.result === "half") return 5;
      return 6;
    }

    function topForDay(date, n) {
      const list = listForDay(date).slice().sort((a, b) => {
        const u = urgency(a, date) - urgency(b, date);
        return u || a.createdAt - b.createdAt;
      });
      return { total: list.length, top: list.slice(0, n) };
    }

    function dayMark(dec, date) {
      if (dec.end === date) return markKind(dec, "end", date);
      return markKind(dec, "start", date);
    }

    function draftReady() {
      const named = draft.options.filter((o) => o.name.trim());
      const chosen = draft.options.find((o) => o.id === draft.chosenId);
      return (
        draft.title.trim() &&
        named.length >= 2 &&
        chosen &&
        chosen.name.trim() &&
        chosen.why.trim() &&
        draft.start &&
        draft.end &&
        draft.end >= draft.start &&
        draft.check.trim()
      );
    }

    function syncDraft() {
      const t = $("#title");
      const bg = $("#bg");
      const check = $("#check");
      const why = $("#why");
      const miss = $("#miss");
      if (t) draft.title = t.value.slice(0, 20);
      if (bg) draft.background = bg.value;
      if (check) draft.check = check.value;
      if (why) {
        const chosen = draft.options.find((o) => o.id === draft.chosenId);
        if (chosen) chosen.why = why.value;
      }
      if (miss) ui.miss = miss.value;
      document.querySelectorAll("[data-opt-name]").forEach((el) => {
        const o = draft.options.find((x) => x.id === el.dataset.optName);
        if (o) o.name = el.value;
      });
      document.querySelectorAll("[data-opt-pro]").forEach((el) => {
        const o = draft.options.find((x) => x.id === el.dataset.optPro);
        if (o) o.pro = el.value;
      });
      document.querySelectorAll("[data-opt-con]").forEach((el) => {
        const o = draft.options.find((x) => x.id === el.dataset.optCon);
        if (o) o.con = el.value;
      });
    }

    function header(title, left, right) {
      return `
        <header class="top">
          <div class="top-row">
            <div class="nav-side">${left || ""}</div>
            <div class="nav-side">${right || ""}</div>
          </div>
          <div class="month-title">${title}</div>
        </header>
      `;
    }

    function weekdayRow() {
      return `<div class="weekdays">${WD.map((w) => `<span>${w}</span>`).join("")}</div>`;
    }

    function calCells(days, mode) {
      const t = today();
      const { y, m } = ym(ui.anchor);
      return days.map((date) => {
        const d = parseIso(date);
        const out = mode === "month" && (d.getFullYear() !== y || d.getMonth() !== m);
        const { total, top } = topForDay(date, 3);
        const has = total > 0;
        const hot = top.some((x) => urgency(x, date) === 0);
        const due = !hot && top.some((x) => urgency(x, date) === 1);
        const cls = [
          "cell",
          out ? "out" : "",
          date === t ? "today" : "",
          has ? "has" : "",
        ].join(" ");
        const count = has
          ? `<span class="cell-n${hot ? " hot" : due ? " due" : ""}">${total}</span>`
          : "";
        const items = top.map((dec) => {
          const k = dayMark(dec, date);
          return `<button type="button" class="cell-item cat-${catOf(dec)}" data-open="${dec.id}">
            <span class="mk ${k}">${glyph(k)}</span>
            <span class="cell-t">${escapeHtml(dec.title)}</span>
          </button>`;
        }).join("");
        const more = total > 3 ? `<span class="cell-more">+${total - 3}</span>` : "";
        const inner = `<div class="cell-head"><span class="num">${d.getDate()}</span>${count}</div>${items}${more}`;
        return `<div class="${cls}" data-day="${date}">${inner}</div>`;
      }).join("");
    }

    function weekList(days) {
      const t = today();
      return `<div class="week-list">${days.map((date) => {
        const d = parseIso(date);
        const wd = WD[(d.getDay() + 6) % 7];
        const { total, top } = topForDay(date, 20);
        const has = total > 0;
        const hot = top.some((x) => urgency(x, date) === 0);
        const due = !hot && top.some((x) => urgency(x, date) === 1);
        const cls = [
          "week-row",
          date === t ? "today" : "",
          has ? "has" : "",
        ].join(" ");
        const count = has
          ? `<span class="week-date-n${hot ? " hot" : due ? " due" : ""}">${total}</span>`
          : "";
        const items = top.map((dec) => {
          const k = dayMark(dec, date);
          return `<button type="button" class="cell-item cat-${catOf(dec)}" data-open="${dec.id}">
            <span class="mk ${k}">${glyph(k)}</span>
            <span class="cell-t">${escapeHtml(dec.title)}</span>
          </button>`;
        }).join("");
        return `<div class="${cls}" data-day="${date}">
          <div class="week-date">
            <span class="week-date-wd">${wd}</span>
            <span class="week-date-num">${d.getDate()}</span>
            ${count}
          </div>
          <div class="week-items">${items}</div>
        </div>`;
      }).join("")}</div>`;
    }

    function renderCal() {
      const mode = ui.mode;
      const days = mode === "week" ? weekCells(ui.anchor) : monthCells(ui.anchor);
      const empty = mode === "month" && !monthHas(ui.anchor);
      const left = `
        <button class="quiet arrow" type="button" data-act="prev" title="${mode === "week" ? "上一周" : "上个月"}">‹</button>
        <button class="quiet arrow" type="button" data-act="next" title="${mode === "week" ? "下一周" : "下个月"}">›</button>
      `;
      const right = `
        <button class="quiet ${mode === "month" ? "on" : ""}" type="button" data-act="month">月</button>
        <button class="quiet ${mode === "week" ? "on" : ""}" type="button" data-act="week">周</button>
        <button class="quiet" type="button" data-act="settings">设置</button>
      `;
      const brand = `
        <div class="brand">
          <img class="brand-logo" src="logo.png" alt="ToughYourself" />
          <span class="brand-name">ToughYourself</span>
        </div>
      `;
      return `
        ${brand}
        ${header(fmtTitle(ui.anchor, mode), left, right)}
        <div class="cat-filter">
          <button type="button" class="cat-pill${ui.filter === "all" ? " on" : ""}" data-act="filter-all">全部</button>
          <button type="button" class="cat-pill work${ui.filter === "work" ? " on" : ""}" data-act="filter-work">工作</button>
          <button type="button" class="cat-pill life${ui.filter === "life" ? " on" : ""}" data-act="filter-life">生活</button>
        </div>
        ${mode === "week" ? "" : weekdayRow()}
        ${mode === "week" ? weekList(days) : `<div class="grid month-grid">${calCells(days, mode)}</div>`}
        ${empty ? `<p class="empty-line">把一条会被打分的选择记下</p>` : ""}
        <div class="dock"><button class="primary" type="button" data-act="compose">记下</button></div>
        ${authMode === "cloud" ? `<p class="sync ${ui.sync === "busy" || ui.sync === "err" ? ui.sync : ""}" id="sync">${syncText()}</p>` : ""}
      `;
    }

    function renderDay() {
      const date = ui.day;
      const list = listForDay(date);
      const items = list.map((d) => {
        const kinds = [];
        if (d.start === date) kinds.push(markKind(d, "start", date));
        if (d.end === date) kinds.push(markKind(d, "end", date));
        const mk = kinds.map((k) => `<span class="mk ${k}">${glyph(k)}</span>`).join("");
        return `<li>
          <button type="button" class="day-row cat-${catOf(d)}" data-open="${d.id}">
            <span class="mks">${mk}</span>
            <span class="theme">${escapeHtml(d.title)}</span>
          </button>
        </li>`;
      }).join("");
      return `
        ${header(fmtShort(date), `<button class="quiet back" type="button" data-act="back" title="返回">‹</button>`, "")}
        ${items ? `<ul class="day-list">${items}</ul>` : `<p class="empty-line">这一天还没有决策</p>`}
        <div class="dock"><button class="primary" type="button" data-act="compose-day">记下</button></div>
      `;
    }

    function whyOfChosen() {
      const chosen = draft.options.find((o) => o.id === draft.chosenId);
      return chosen ? chosen.why || "" : "";
    }

    function suppOpen(id) {
      if (id in ui.supp) return ui.supp[id];
      const o = draft.options.find((x) => x.id === id);
      return !!(o && ((o.pro || "").trim() || (o.con || "").trim()));
    }

    function optionRow(o, i) {
      const on = draft.chosenId === o.id;
      const filled = [o.pro, o.con].some((x) => x && x.trim());
      const open = suppOpen(o.id);
      return `
        <div class="opt ${on ? "on" : ""}" data-choose="${o.id}">
          <div class="opt-top">
            <span class="radio"><i></i></span>
            <span class="opt-num">${i + 1}</span>
            <input class="opt-name" data-opt-name="${o.id}" maxlength="40" placeholder="一条路" value="${escapeHtml(o.name)}" />
            <button class="supp-btn ${open ? "on" : ""}" type="button" data-supp="${o.id}">补充</button>
          </div>
          ${!open && filled ? `<p class="hint-mini">${escapeHtml((o.pro || o.con).trim())}</p>` : ""}
          ${open ? `<div class="supp" data-stop="1">
            <input class="line-in" data-opt-pro="${o.id}" maxlength="80" placeholder="好处" value="${escapeHtml(o.pro)}" />
            <input class="line-in" data-opt-con="${o.id}" maxlength="80" placeholder="代价" value="${escapeHtml(o.con)}" />
          </div>` : ""}
        </div>
      `;
    }

    function miniCal() {
      const focus = draft.end && !inMonth(draft.start, draft.end) && ui.pick === "end"
        ? draft.end
        : draft.start || today();
      const days = monthCells(focus);
      const { y, m } = ym(focus);
      return `
        <div class="mini">
          ${weekdayRow()}
          <div class="grid">${days.map((date) => {
            const d = parseIso(date);
            const out = d.getFullYear() !== y || d.getMonth() !== m;
            const span = draft.start && draft.end && date > draft.start && date < draft.end;
            const disabled = ui.pick === "end" && draft.start && date < draft.start;
            const cls = [
              "cell",
              out ? "out" : "",
              date === today() ? "today" : "",
              span ? "span" : "",
              disabled ? "" : "pickable",
            ].join(" ");
            const kinds = [];
            if (draft.start === date) kinds.push("start-live");
            if (draft.end === date) kinds.push("end-live");
            const mk = kinds.map((k) => `<span class="mk ${k}"></span>`).join("");
            return `<button type="button" class="${cls}" data-pick="${date}" ${disabled ? "disabled" : ""}>
              <span class="num">${d.getDate()}</span>
              <span class="mks">${mk}</span>
            </button>`;
          }).join("")}</div>
        </div>
      `;
    }

    function renderCompose() {
      const startOn = ui.pick === "start" ? "on" : "";
      const endOn = ui.pick === "end" ? "on" : "";
      return `
        ${header("记下", `<button class="quiet back" type="button" data-act="back" title="返回">‹</button>`, "")}
        <div class="paper">
          <input class="title-in" id="title" maxlength="20" placeholder="给这条决策起个短名" value="${escapeHtml(draft.title)}" />

    function loadQca() {
      try {
        const raw = JSON.parse(localStorage.getItem(QCA_KEY) || "null");
        if (raw && typeof raw === "object") {
          return {
            pat: typeof raw.pat === "string" ? raw.pat : "",
            currentAgentId: typeof raw.currentAgentId === "string" ? raw.currentAgentId : "",
          };
        }
      } catch (_) {}
      return { pat: "", currentAgentId: "" };
    }

    function saveQca(next) {
      localStorage.setItem(QCA_KEY, JSON.stringify({
        pat: next.pat || "",
        currentAgentId: next.currentAgentId || "",
      }));
    }

    function maskPat(pat) {
      if (!pat) return "";
      return pat.slice(0, 3) + "••••" + pat.slice(-4);
    }

    function modelIdOf(agent) {
      const m = agent && agent.model;
      if (!m) return "";
      return typeof m === "string" ? m : (m.id || "");
    }

    function qcaErrText(res, body) {
      if (res.status === 401) return "钥匙不对，请重新填写。";
      if (res.status === 409) return "这个 Agent 刚被改过，请返回列表再打开一次。";
      if (res.status === 429) return "Qoder 忙，请稍后再试。";
      const msg = body && ((body.error && body.error.message) || body.message || (typeof body.error === "string" ? body.error : ""));
      if (msg === "bad path") return "AI 代理路径不对，请刷新后再试；若刚部署，等一分钟再开设置。";
      if (msg) return msg;
      return "没连上 Qoder（" + res.status + "）。";
    }

    async function qcaJson(path, opts) {
      const pat = loadQca().pat;
      const headers = { Authorization: "Bearer " + pat };
      if (opts && opts.body != null) headers["Content-Type"] = "application/json";
      let res;
      try {
        res = await fetch("/api/qca/" + path, {
          method: (opts && opts.method) || "GET",
          headers,
          body: opts && opts.body != null ? JSON.stringify(opts.body) : undefined,
        });
      } catch (_) {
        const err = new Error("AI 设置需要在已部署的网站上打开，或在本目录运行 vercel dev。");
        err.status = 0;
        throw err;
      }
      const text = await res.text();
      let body = null;
      if (text) {
        try { body = JSON.parse(text); } catch (_) { body = { message: text.slice(0, 200) }; }
      }
      if (!res.ok) {
        const err = new Error(qcaErrText(res, body));
        err.status = res.status;
        throw err;
      }
      return body;
    }

    async function listAgents() {
      const out = [];
      let page = "";
      for (let i = 0; i < 20; i++) {
        const path = page ? "agents?page=" + encodeURIComponent(page) : "agents";
        const body = await qcaJson(path);
        out.push.apply(out, (body && body.data) || []);
        if (!body || !body.has_more || !body.next_page) break;
        page = body.next_page;
      }
      return out;
    }

    async function refreshQca() {
      ui.qcaBusy = true;
      ui.qcaErr = "";
      render();
      try {
        const [agents, modelsBody] = await Promise.all([
          listAgents(),
          qcaJson("models"),
        ]);
        ui.qcaAgents = agents;
        ui.qcaModels = ((modelsBody && modelsBody.data) || []).filter((m) => m && m.is_enabled !== false);
        ui.qcaReady = true;
        const cfg = loadQca();
        if (cfg.currentAgentId && !agents.some((a) => a.id === cfg.currentAgentId)) {
          saveQca({ pat: cfg.pat, currentAgentId: "" });
        }
      } catch (err) {
        ui.qcaErr = err.message || "没连上 Qoder。";
        ui.qcaReady = false;
        if (err.status === 401) {
          ui.qcaAgents = [];
          ui.qcaModels = [];
        }
      }
      ui.qcaBusy = false;
      render();
    }

      else if (ui.screen === "compose") shell.innerHTML = renderCompose();
      else if (ui.screen === "settings") shell.innerHTML = renderSettings();
      else if (ui.screen === "agent-form") shell.innerHTML = renderAgentForm();
      else shell.innerHTML = renderPaper();
      bind();
    }

    function goCal() {
      ui.screen = "cal";
      ui.err = "";
      ui.editing = false;
      ui.concludeOpen = false;
      ui.confirmDel = false;
      render();
    }

    function openCompose(start) {
      draft = emptyDraft();
      draft.start = start || today();
      ui.bgOpen = false;
      ui.supp = {};
      ui.pick = "end";
      ui.err = "";
      ui.paperId = null;
      ui.screen = "compose";
      render();
      const title = $("#title");
      if (title) title.focus();
    }

    function openPaper(id) {
      const d = byId(id);
      if (!d) return;
      ui.paperId = id;
      ui.screen = "paper";
      ui.editing = false;
      ui.err = "";
      ui.concludeOpen = false;
      ui.verdict = "";
      ui.miss = "";
      ui.confirmDel = false;
      render();
    }

    function startEdit() {
      const d = byId(ui.paperId);
      if (!d || d.result) return;
      ui.editing = true;
      ui.err = "";
      ui.concludeOpen = false;
      ui.bgOpen = !!d.background;
      ui.supp = {};
      ui.pick = "end";
      draft = {
        title: d.title,
        background: d.background || "",
        category: catOf(d),
        options: d.options.map((o) => ({ ...o })),
        chosenId: d.chosenId,
        start: d.start,
        end: d.end,
        check: d.check,
      };
      render();
    }

    function applyDraftTo(d) {
      const named = draft.options.filter((o) => o.name.trim());
      if (named.length < 2) return false;
      const chosen = named.find((o) => o.id === draft.chosenId);
      if (!chosen || !chosen.why.trim()) return false;
      if (!draft.title.trim() || !draft.end || draft.end < draft.start || !draft.check.trim()) return false;
      d.title = draft.title.trim();
      d.background = draft.background.trim();
      d.options = named;
      d.chosenId = chosen.id;
      d.start = draft.start;
      d.end = draft.end;
      d.check = draft.check.trim();
      d.category = draft.category;
      return true;
    }

    function bind() {
      const shell = $("#shell");
      shell.onclick = (e) => {
        if (e.target.classList && e.target.classList.contains("mask")) {
          ui.confirmDel = false;
          ui.qcaConfirmDel = false;
          render();
          return;
        }
        const t = e.target.closest("[data-act], [data-day], [data-open], [data-choose], [data-supp], [data-pick], [data-v], [data-cat]");
        if (!t) return;

        if (t.dataset.open) {
          openPaper(t.dataset.open);
          return;
        }
        if (t.dataset.day) {
          const date = t.dataset.day;
          if (!listForDay(date).length) {
            ui.day = date;
            openCompose(date);
            return;
          }
          ui.day = date;
          ui.screen = "day";
          render();
          return;
        }
        if (t.dataset.supp) {
          e.stopPropagation();
          syncDraft();
          const id = t.dataset.supp;
          ui.supp[id] = !suppOpen(id);
          render();
          return;
        }
        if (t.dataset.cat && !t.dataset.act) {
          syncDraft();
          draft.category = t.dataset.cat;
          render();
          return;
        }
        if (t.dataset.choose) {
          if (e.target.closest(".supp-btn, .supp")) return;
          const id = t.dataset.choose;
          const fromName = e.target.closest(".opt-name");
          if (fromName && draft.chosenId === id) return;
          syncDraft();
          draft.chosenId = id;
          render();
          if (fromName) {
            const name = $(`[data-opt-name="${id}"]`);
            if (name) name.focus();
          } else {
            const why = $("#why");
            if (why) why.focus();
          }
          return;
        }
        if (t.dataset.pick) {
          const date = t.dataset.pick;
          if (ui.pick === "start") {
            draft.start = date;
            if (draft.end && draft.end < date) draft.end = date;
          } else if (!draft.start || date >= draft.start) {
            draft.end = date;
          }
          ui.err = "";
          render();
          return;
        }
        if (t.dataset.v) {
          ui.verdict = t.dataset.v;
          render();
          const miss = $("#miss");
          if (miss && t.dataset.v !== "right") miss.focus();
          return;
        }

        const act = t.dataset.act;
        if (act === "prev") {
          ui.anchor = ui.mode === "week" ? addDays(ui.anchor, -7) : addMonths(ui.anchor, -1);
          render();
        } else if (act === "next") {
          ui.anchor = ui.mode === "week" ? addDays(ui.anchor, 7) : addMonths(ui.anchor, 1);
          render();
        } else if (act === "month") {
          ui.mode = "month";
          render();
        } else if (act === "week") {
          ui.mode = "week";
          render();
        } else if (act === "filter-all" || act === "filter-work" || act === "filter-life") {
          ui.filter = act.slice(7);
          render();
        } else if (act === "compose") {
          ui.day = null;
          openCompose(today());
        } else if (act === "compose-day") {
          openCompose(ui.day || today());
        } else if (act === "edit") {
          startEdit();
        } else if (act === "back") {
          if (ui.screen === "agent-form") {
            ui.qcaConfirmDel = false;
            ui.qcaErr = "";
            ui.screen = "settings";
            render();
          } else if (ui.screen === "settings") {
            goCal();
          } else if (ui.screen === "paper") {
            if (ui.editing) {
              syncDraft();
              const d = byId(ui.paperId);
              if (d && !d.result && applyDraftTo(d)) save();
              ui.editing = false;
              ui.concludeOpen = false;
              render();
            } else {
              ui.day = null;
              ui.paperId = null;
              goCal();
            }
          } else if (ui.screen === "compose") {
            const start = draft.start;
            if (start && listForDay(start).length) {
              ui.day = start;
              ui.screen = "day";
              ui.err = "";
              render();
            } else {
              ui.day = null;
              goCal();
            }
          } else {
            ui.day = null;
            ui.paperId = null;
            goCal();
          }
        } else if (act === "bg") {
          syncDraft();
          ui.bgOpen = !ui.bgOpen;
          render();
        } else if (act === "add-opt") {
          syncDraft();
          draft.options.push({ id: uid(), name: "", note: "", pro: "", con: "", why: "" });
          render();
          const names = document.querySelectorAll("[data-opt-name]");
          const last = names[names.length - 1];
          if (last) last.focus();
        } else if (act === "pick-start") {
          ui.pick = "start";
          render();
        } else if (act === "pick-end") {
          ui.pick = "end";
          render();
        } else if (act === "save") {
          syncDraft();
          if (!draftReady()) {
            ui.err = "还差主题、两条路、选中一条路、决策原因、回头看，和怎么验证。";
            render();
            return;
          }
          const named = draft.options.filter((o) => o.name.trim());
          data.decisions.push({
            id: uid(),
            createdAt: Date.now(),
            title: draft.title.trim(),
            background: draft.background.trim(),
            options: named,
            chosenId: draft.chosenId,
            start: draft.start,
            end: draft.end,
            check: draft.check.trim(),
            later: "",
            result: null,
            miss: "",
          });
          save();
          ui.anchor = draft.start;
          goCal();
        } else if (act === "open-conclude") {
          ui.concludeOpen = true;
          render();
        } else if (act === "re-conclude") {
          const d = byId(ui.paperId);
          if (!d || !d.result) return;
          ui.concludeOpen = true;
          ui.verdict = d.result;
          ui.miss = d.miss || "";
          render();
        } else if (act === "cancel-conclude") {
          ui.concludeOpen = false;
          ui.verdict = "";
          ui.miss = "";
          render();
        } else if (act === "add-note") {
          const d = byId(ui.paperId);
          const box = $("#note-in");
          const text = box ? box.value.trim() : "";
          if (!d || !d.result || !text) return;
          if (!Array.isArray(d.notes)) d.notes = [];
          d.notes.push({ id: uid(), at: Date.now(), text });
          save();
          render();
        } else if (act === "confirm-verdict") {
          syncDraft();
          const d = byId(ui.paperId);
          if (!d || !ui.verdict) return;
          d.result = ui.verdict;
          d.miss = ui.miss.trim();
          save();
          ui.concludeOpen = false;
          ui.verdict = "";
          ui.miss = "";
          render();
        } else if (act === "ask-del") {
          ui.confirmDel = true;
          render();
        } else if (act === "cancel-del") {
          ui.confirmDel = false;
          render();
        } else if (act === "del") {
          data.decisions = data.decisions.filter((x) => x.id !== ui.paperId);
          save();
          ui.paperId = null;
          ui.confirmDel = false;
          goCal();
        } else if (act === "logout") {
          logout();
        } else if (act === "to-login") {
          renderLogin();
        } else if (act === "settings") {
          openSettings();
        } else if (act === "save-pat") {
          const box = $("#qca-pat");
          const pat = box ? box.value.trim() : "";
          if (!pat) {
            ui.qcaErr = "请填入个人访问令牌。";
            render();
            return;
          }
          saveQca({ pat, currentAgentId: "" });
          ui.qcaReplacing = false;
          refreshQca();
        } else if (act === "replace-pat") {
          ui.qcaReplacing = true;
          ui.qcaErr = "";
          render();
        } else if (act === "cancel-replace-pat") {
          ui.qcaReplacing = false;
          ui.qcaErr = "";
          render();
        } else if (act === "clear-pat") {
          saveQca({ pat: "", currentAgentId: "" });
          ui.qcaAgents = [];
          ui.qcaModels = [];
          ui.qcaReplacing = false;
          ui.qcaReady = false;
          ui.qcaErr = "";
          render();
        } else if (act === "use-agent") {
          const cfg = loadQca();
          saveQca({ pat: cfg.pat, currentAgentId: t.dataset.id || "" });
          render();
        } else if (act === "edit-agent") {
          e.stopPropagation();
          const id = t.dataset.id;
          if (!id || ui.qcaBusy) return;
          ui.qcaBusy = true;
          ui.qcaErr = "";
          render();
          qcaJson("agents/" + encodeURIComponent(id)).then((agent) => {
            agentForm = {
              id: agent.id,
              name: agent.name || "",
              system: agent.system || "",
              model: modelIdOf(agent),
              version: agent.version,
            };
            ui.qcaBusy = false;
            ui.screen = "agent-form";
            ui.qcaConfirmDel = false;
            render();
          }).catch((err) => {
            ui.qcaBusy = false;
            ui.qcaErr = err.message || "打不开这个 Agent。";
            render();
          });
        } else if (act === "new-agent") {
          if (ui.qcaBusy) return;
          const first = ui.qcaModels[0];
          agentForm = {
            id: null,
            name: "",
            system: "",
            model: first ? first.id : "",
            version: null,
          };
          ui.qcaErr = "";
          ui.qcaConfirmDel = false;
          ui.screen = "agent-form";
          render();
          const name = $("#agent-name");
          if (name) name.focus();
        } else if (act === "save-agent") {
          if (ui.qcaBusy) return;
          const nameEl = $("#agent-name");
          const sysEl = $("#agent-system");
          const modelEl = $("#agent-model");
          const name = nameEl ? nameEl.value.trim() : "";
          const system = sysEl ? sysEl.value : "";
          const model = modelEl ? modelEl.value : "";
          if (!name) {
            ui.qcaErr = "请给 Agent 起个名字。";
            render();
            return;
          }
          if (!model) {
            ui.qcaErr = "请选择模型。";
            render();
            return;
          }
          ui.qcaBusy = true;
          ui.qcaErr = "";
          render();
          const after = () => {
            ui.qcaBusy = false;
            ui.screen = "settings";
            refreshQca();
          };
          const fail = (err) => {
            ui.qcaBusy = false;
            ui.qcaErr = err.message || "没保存成。";
            render();
          };
          if (agentForm.id) {
            qcaJson("agents/" + encodeURIComponent(agentForm.id)).then((fresh) => {
              return qcaJson("agents/" + encodeURIComponent(agentForm.id), {
                method: "POST",
                body: { name, system, model, version: fresh.version },
              });
            }).then(after).catch(fail);
          } else {
            qcaJson("agents", {
              method: "POST",
              body: {
                name,
                system,
                model,
                tools: [{ type: "agent_toolset_20260401" }],
              },
            }).then((created) => {
              const cfg = loadQca();
              if (created && created.id && !cfg.currentAgentId) {
                saveQca({ pat: cfg.pat, currentAgentId: created.id });
              }
              after();
            }).catch(fail);
          }
        } else if (act === "ask-del-agent") {
          ui.qcaConfirmDel = true;
          render();
        } else if (act === "cancel-del-agent") {
          ui.qcaConfirmDel = false;
          render();
        } else if (act === "del-agent") {
          if (!agentForm.id || ui.qcaBusy) return;
          ui.qcaBusy = true;
          ui.qcaErr = "";
          ui.qcaConfirmDel = false;
          render();
          qcaJson("agents/" + encodeURIComponent(agentForm.id), { method: "DELETE" }).then(() => {
            const cfg = loadQca();
            if (cfg.currentAgentId === agentForm.id) {
              saveQca({ pat: cfg.pat, currentAgentId: "" });
            }
            agentForm = { id: null, name: "", system: "", model: "" };
            ui.qcaBusy = false;
            ui.screen = "settings";
            refreshQca();
          }).catch((err) => {
            ui.qcaBusy = false;
            ui.qcaErr = err.message || "没删掉。";
            render();
          });
        }
      };

      shell.oninput = () => {
        syncDraft();
        const saveBtn = shell.querySelector("[data-act=save]");
        if (saveBtn) saveBtn.disabled = !draftReady();
        const confirmBtn = shell.querySelector("[data-act=confirm-verdict]");
        if (confirmBtn) confirmBtn.disabled = !ui.verdict;
        const noteBtn = shell.querySelector("[data-act=add-note]");
        const noteBox = $("#note-in");
        if (noteBtn) noteBtn.disabled = !(noteBox && noteBox.value.trim());
        const t = $("#title");
        if (t && t.value.length > 20) t.value = t.value.slice(0, 20);
      };

      shell.onkeydown = (e) => {
        if (e.key === "Enter" && e.target.matches(".opt-name, .title-in, .line-in")) {
          e.preventDefault();
        }
      };
    }

    // ---- 登录（Google，经 Supabase OAuth）与启动 ----
    const G_ICON = `<svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.8.54-1.84.86-3.05.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A8.99 8.99 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.71A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.16.28-1.71V5.96H.96A8.99 8.99 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0A8.99 8.99 0 0 0 .96 5.96l3.01 2.33C4.68 6.16 6.66 3.58 9 3.58z"/></svg>`;

    function renderLogin() {
      const shell = $("#shell");
      shell.className = "shell";
      shell.innerHTML = `
        <header class="top">
          <div class="top-row"></div>
          <div class="month-title">决策</div>
        </header>
        <p class="tagline">用日历记下会被打分的选择，<br/>到期回头看对了、错了、还是一半。</p>
        <div class="login">
          <button class="gbtn" type="button" data-login="google">${G_ICON}<span>使用 Google 登录</span></button>
          <button class="ghost" type="button" data-login="local">不登录，仅本机使用</button>
        </div>
        <p class="login-note">登录后，决策会同步到云端，换设备也不丢。<br/>仅本机使用时，数据只存在这台设备的浏览器里。</p>
        <p class="err login-err">${escapeHtml(loginErr)}</p>
      `;
      shell.onclick = async (e) => {
        const t = e.target.closest("[data-login]");
        if (!t) return;
        if (t.dataset.login === "google") {
          t.disabled = true;
          await loginGoogle();
          t.disabled = false;
        } else {
          enterLocal();
        }
      };
    }

    async function loginGoogle() {
      const { error } = await sb.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: new URL(window.location.pathname, window.location.origin).href,
        },
      });
      if (error) {
        loginErr = "登录没成功：" + (error.message || "请稍后再试");
        renderLogin();
      }
    }

    function enterLocal() {
      authMode = "local";
      userId = null;
      userEmail = "";
      data = loadKey(KEY);
      goCal();
    }

    async function enterCloud(session) {
      authMode = "cloud";
      userId = session.user.id;
      userEmail = session.user.email || "";
      loginErr = "";
      const userCloudKey = cloudKey(userId);
      data = loadKey(userCloudKey);
      setSync("busy");
      render();
      const { data: row, error } = await sb
        .from("decisions")
        .select("data")
        .eq("user_id", userId)
        .maybeSingle();
      if (error) {
        console.error("load failed:", error.message);
        setSync("err");
        return;
      }
      if (row && row.data && Array.isArray(row.data.decisions)) {
        if (JSON.stringify(row.data) !== JSON.stringify(data)) {
          data = row.data;
          localStorage.setItem(userCloudKey, JSON.stringify(data));
          render();
        }
      } else {
        // 首次登录：把本机未登录时记下的数据带上云端
        const local = loadKey(KEY);
        if (local.decisions.length) {
          data = local;
          localStorage.setItem(userCloudKey, JSON.stringify(data));
          cloudSave();
        }
      }
      setSync("ok");
    }

    async function logout() {
      try { await sb.auth.signOut(); } catch (_) {}
      enterLocal();
    }

    async function init() {
      if (!CLOUD_READY || !window.supabase) {
        enterLocal();
        return;
      }
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      sb.auth.onAuthStateChange((evt, session) => {
        // Supabase 建议不要在回调栈内继续调用其异步 API，移到下一轮事件循环。
        setTimeout(() => {
          if (session && session.user && (authMode !== "cloud" || userId !== session.user.id)) {
            enterCloud(session);
          } else if (evt === "SIGNED_OUT" && authMode === "cloud") {
            enterLocal();
          }
        }, 0);
      });
      let session = null;
      try {
        const res = await sb.auth.getSession();
        session = res.data && res.data.session;
      } catch (_) {}
      if (session && session.user) {
        await enterCloud(session);
        return;
      }
      renderLogin();
    }

    init();
  </script>
</body>
